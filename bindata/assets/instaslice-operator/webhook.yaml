apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: CERTIFICATE_NAMESPACE/CERTIFICATE_NAME
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/created-by: das-operator
    app.kubernetes.io/instance: mutating-webhook-configuration
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: mutatingwebhookconfiguration
    app.kubernetes.io/part-of: das-operator
  name: das-mutating-webhook-configuration
webhooks:
# Pod webhook - mutates pods for DAS scheduler
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: das-operator-webhook
      namespace: das-operator
      path: /mutate-pod
      port: 8443
  failurePolicy: Fail
  name: pod.instaslice.redhat.com
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - das-operator
      - cert-manager
      - kube-system
      - openshift-operators
      - openshift-marketplace
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  sideEffects: None
# Workload webhook - mutates Kueue Workloads for admission control
# This enables proper GPU memory quota enforcement for all workload types
# (Jobs, RayJobs, PyTorchJobs, Deployments, StatefulSets, etc.)
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: das-operator-webhook
      namespace: das-operator
      path: /mutate-workload
      port: 8443
  failurePolicy: Ignore
  name: workload.instaslice.redhat.com
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - das-operator
      - cert-manager
      - kube-system
      - openshift-operators
      - openshift-marketplace
  rules:
  - apiGroups:
    - kueue.x-k8s.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - workloads
  sideEffects: None
